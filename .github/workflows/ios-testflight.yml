name: ios-testflight
# Builds the iOS app on a cloud Mac, signs it with the App Store Connect API key (automatic, cloud-managed signing —
# no Mac or certificates needed locally) and uploads it to TestFlight. Setup: docs/RELEASING.md.
# Without the secrets it only proves that the archive builds, unsigned.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "internal = with tester tools (pose recorder, debug buttons); release = what the App Store gets"
        type: choice
        options: [internal, release]
        default: internal
      runner:
        description: "Cloud Mac type — Intel has shorter queues when Apple-silicon runners are overloaded"
        type: choice
        options: [macos-15-intel, macos-latest]
        default: macos-15-intel

jobs:
  testflight:
    concurrency: ios-signing   # one signing run at a time (Apple's certificate per machine)
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      FLAVOR: ${{ inputs.flavor || 'release' }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify
      - name: Signing secrets
        id: secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::warning::Missing secrets:$missing — building unsigned only (docs/RELEASING.md)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "PUSHLY_TEAM_ID = $APPLE_TEAM_ID" > Config/Secrets.xcconfig
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Temporary development identity (revoked at the end of the run)
        if: steps.secrets.outputs.signed == 'true'
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 ../tools/ci/asc_dev_cert.py create "$RUNNER_TEMP/signing"
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/signing/dev.p12" -k "$KC" -P "$(cat "$RUNNER_TEMP/signing/password")" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive
        run: |
          CONFIG=$([ "$FLAVOR" = internal ] && echo Debug || echo Release)
          echo "Archiving $CONFIG, build ${{ github.run_number }}"
          if [ "${{ steps.secrets.outputs.signed }}" = true ]; then
            SIGN=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
                  -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" CODE_SIGN_STYLE=Automatic)
          else
            SIGN=(CODE_SIGNING_ALLOWED=NO)
          fi
          ../tools/ci/run-annotated.sh "xcodebuild archive" bash -c 'set -o pipefail; xcodebuild archive -project Pushly.xcodeproj -scheme Pushly \
            -configuration "$0" -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Pushly.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} ENABLE_DEBUG_DYLIB=NO "${@}" | xcbeautify' "$CONFIG" "${SIGN[@]}"
      - name: Upload to TestFlight
        if: steps.secrets.outputs.signed == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><$([ "$FLAVOR" = internal ] && echo true || echo false)/>
          </dict></plist>
          PLIST
          ../tools/ci/run-annotated.sh "xcodebuild export" bash -c 'set -o pipefail; xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Pushly.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | xcbeautify'
          echo "::notice::Build ${{ github.run_number }} ($FLAVOR) uploaded — it appears in TestFlight after Apple's processing (~10–30 min)."
      - name: Revoke the temporary development certificate
        if: always() && steps.secrets.outputs.signed == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/signing/cert_id" ]; then
            python3 ../tools/ci/asc_dev_cert.py revoke "$(cat "$RUNNER_TEMP/signing/cert_id")"
          fi
