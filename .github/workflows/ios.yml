name: ios
on:
  pull_request:
    paths: ["ios/**", "shared/**", "tools/ci/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", "shared/**", "tools/ci/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build-test:
    # Builds and tests the iOS app on a cloud Mac — no local Mac needed (see docs/DEVELOPMENT.md).
    runs-on: macos-latest
    permissions:
      contents: write   # screenshots are pushed to the ci-screenshots branch
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::Xcode 26 not installed on this runner image"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS-26' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build & test
        run: |
          ../tools/ci/run-annotated.sh "xcodebuild test" bash -c 'set -o pipefail; xcodebuild test -project Pushly.xcodeproj -scheme Pushly \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | xcbeautify' 
      - name: Screenshots (debug screens)
        # Visual check of the design on a real simulator; never fails the build.
        continue-on-error: true
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find build/dd/Build/Products -name Pushly.app -path "*iphonesimulator*" | head -1)
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          shot() {
            xcrun simctl terminate "$UDID" app.pushly 2>/dev/null || true
            xcrun simctl launch "$UDID" app.pushly -PushlyDebugScreen "$1" ${2:+-PushlyDebugTab "$2"}
            sleep 4
            xcrun simctl io "$UDID" screenshot "screenshots/$1${2:+-$2}.png"
          }
          shot launch; shot welcome; shot signIn; shot profileSetup; shot update; shot main; shot main profile
      - name: Publish screenshots to the ci-screenshots branch
        # Artifacts are also uploaded, but a branch is readable from anywhere with plain git.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "iOS screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios/screenshots
          if-no-files-found: ignore
