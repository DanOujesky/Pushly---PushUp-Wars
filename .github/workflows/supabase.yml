name: supabase
on:
  pull_request:
    paths: ["supabase/**", "tools/db-sandbox/**", ".github/workflows/supabase.yml"]
  push:
    branches: [main]
    paths: ["supabase/**", "tools/db-sandbox/**", ".github/workflows/supabase.yml"]

jobs:
  db-sandbox:
    # Fast check on the runner's plain Postgres (pgTAP subset shim) — same script used locally without Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          pg_isready
      - name: Migrations + database tests
        run: sudo -u postgres env PATH="$PATH" tools/db-sandbox/run-tests.sh

  supabase-cli:
    # Full check on the real Supabase stack with real pgTAP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint
      - run: deno fmt --check
      - run: deno test --allow-env
