name: android-release
# Builds the signed release bundle (AAB) for Google Play. Setup + first upload: docs/RELEASING.md.
# Without the keystore secrets (e.g. on a push of this file) it only proves that the release build (R8) works.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/android-release.yml", "android/app/proguard-rules.pro"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      PUSHLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PUSHLY_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config for push (optional secret GOOGLE_SERVICES_JSON)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; echo "push enabled";
          else echo "::notice::No GOOGLE_SERVICES_JSON secret — building without push (docs/RELEASING.md)"; fi
      - name: Upload key
        id: key
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$PUSHLY_KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PUSHLY_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD — building unsigned only (docs/RELEASING.md)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release bundle
        run: ../tools/ci/run-annotated.sh "gradle bundleRelease" ./gradlew :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: pushly-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
