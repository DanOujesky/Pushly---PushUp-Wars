name: ios-signing-check
# Check of what the App Store Connect API key can access + a signing dry run (asc_sign.py setup, then cleanup).
on:
  workflow_dispatch:
    inputs:
      resend_invite:
        description: "Re-send the TestFlight invitation to testers who haven't accepted"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --quiet pyjwt cryptography
      - name: Diagnose
        run: |
          if [ "${{ inputs.resend_invite }}" = true ]; then python3 tools/ci/asc_dev_cert.py resend > out.txt 2>&1 || true; fi
          python3 tools/ci/asc_dev_cert.py diagnose >> out.txt 2>&1 || true
          echo "--- signing dry run (created and removed again) ---" >> out.txt
          python3 tools/ci/asc_sign.py setup "$RUNNER_TEMP/signing" >> out.txt 2>&1 || echo "SETUP FAILED" >> out.txt
          python3 tools/ci/asc_sign.py cleanup "$RUNNER_TEMP/signing" >> out.txt 2>&1 || echo "CLEANUP FAILED" >> out.txt
          cat out.txt
          printf '%s' "$ASC_KEY_P8" | grep -c $'\r' | sed 's/^/CR lines in key: /'
          body="$(sed -e 's/%/%25/g' out.txt | awk '{printf "%s%%0A", $0}')"
          echo "::notice title=ASC key access::${body}"
