name: android
on:
  workflow_dispatch:
  pull_request:
    paths: ["android/**", "shared/**", "tools/ci/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "shared/**", "tools/ci/**", ".github/workflows/android.yml"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config for push (optional secret GOOGLE_SERVICES_JSON)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; echo "push enabled";
          else echo "::notice::No GOOGLE_SERVICES_JSON secret — building without push (docs/RELEASING.md)"; fi
      - name: Unit tests
        run: ../tools/ci/run-annotated.sh "gradle test" ./gradlew test --continue
      - name: Test summary
        if: always()
        run: python3 ../tools/ci/junit-summary.py .
      - name: Assemble debug APK
        run: ../tools/ci/run-annotated.sh "gradle assemble" ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pushly-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
