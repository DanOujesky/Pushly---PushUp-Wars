name: fetch-pose-models
# One-off / on demand: downloads the MediaPipe Pose Landmarker models (Apache 2.0) into shared/pose-models and
# commits them, because the dev sandbox cannot reach storage.googleapis.com. Codegen copies them into both apps.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-pose-models.yml"]

jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download models
        run: |
          mkdir -p shared/pose-models
          base=https://storage.googleapis.com/mediapipe-models/pose_landmarker
          curl -sSfL -o shared/pose-models/pose_landmarker_full.task "$base/pose_landmarker_full/float16/latest/pose_landmarker_full.task"
          curl -sSfL -o shared/pose-models/pose_landmarker_lite.task "$base/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task"
          (cd shared/pose-models && sha256sum *.task > SHA256SUMS && ls -la)
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add shared/pose-models
          git diff --cached --quiet && { echo "models unchanged"; exit 0; }
          git commit -m "chore(pose): fetch MediaPipe pose landmarker models (Apache 2.0)"
          git push
