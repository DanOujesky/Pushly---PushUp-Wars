name: android-keystore
# One-off: creates the Google Play UPLOAD key (Play App Signing holds the real app signing key, so a lost upload key
# can be reset by Google). The result is a 1-day artifact; copy both values into repository secrets, keep a backup of
# the keystore somewhere private, then delete the artifact. Steps: docs/RELEASING.md.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate upload key
        run: |
          mkdir out
          PASS=$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 32)
          keytool -genkeypair -v -keystore out/pushly-upload.jks -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Pushly, O=Pushly, C=CZ"
          base64 -w0 out/pushly-upload.jks > out/ANDROID_KEYSTORE_B64.txt
          printf '%s' "$PASS" > out/ANDROID_KEYSTORE_PASSWORD.txt
          keytool -list -v -keystore out/pushly-upload.jks -storepass "$PASS" | grep -E "SHA1|SHA256" > out/fingerprints.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pushly-upload-key
          path: out/
          retention-days: 1
