name: android-screens
# Emulator run: screenshots of the main screens + a real practice alarm ringing on a locked phone.
# Results are pushed to the ci-screenshots-android branch (readable with plain git).
# Manual only for now: the emulator does not boot on hosted runners (3 attempts, 2026-10-20 — see docs/STATUS.md).
on:
  workflow_dispatch:

jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/android-screens.sh android/app/build/outputs/apk/debug/app-debug.apk screenshots
      - name: Publish to the ci-screenshots-android branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b ci-screenshots-android
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Android screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots-android
