# Supabase CLI configuration for local development (`supabase start`).
# If a newer CLI complains about a key, run `supabase init --force` in a scratch folder and copy the new defaults over,
# keeping the project-specific values below.
project_id = "pushly"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "pushly://auth-callback"
additional_redirect_urls = ["pushly://auth-callback", "https://pushly.app/auth-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Email OTP / magic link only — no passwords in the app (doc 02 PS-02)
otp_length = 6
otp_expiry = 600

[auth.external.apple]
enabled = false   # enable with real credentials in staging/prod (doc 03 §6)
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true   # required for native Google sign-in on iOS

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.health]
verify_jwt = false
