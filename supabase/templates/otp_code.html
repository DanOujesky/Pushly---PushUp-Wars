<!-- Email with the 6-digit sign-in code (doc 02 PS-02). Used for both "magic link" and "confirm signup". -->
<div style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #12121C;">
  <h1 style="font-size: 24px; margin: 0 0 16px;">Your Pushly code</h1>
  <p style="font-size: 16px; line-height: 22px; margin: 0 0 24px;">Enter this code in the app to sign in:</p>
  <p style="font-size: 40px; font-weight: 800; letter-spacing: 8px; margin: 0 0 24px; color: #F04E12;">{{ .Token }}</p>
  <p style="font-size: 14px; line-height: 20px; color: #5B5B70; margin: 0;">The code expires in 10 minutes. If you didn't try to sign in, you can ignore this email.</p>
</div>
