# XcodeGen spec — generates Pushly.xcodeproj (the .xcodeproj is NOT committed; regenerate with `xcodegen generate`).
# Install: brew install xcodegen   (also runs in CI on macOS runners)
name: Pushly
options:
  bundleIdPrefix: app.pushly
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "$(PUSHLY_TEAM_ID)"
configs:
  Debug: debug
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig

packages:
  Core:
    path: Packages/Core
  AlarmDomain:
    path: Packages/AlarmDomain
  AlarmFeature:
    path: Packages/AlarmFeature
  MediaPipeVision:
    path: Packages/MediaPipeVision
  PoseEngine:
    path: Packages/PoseEngine
  WakeFlowFeature:
    path: Packages/WakeFlowFeature
  DesignSystem:
    path: Packages/DesignSystem
  RepEngine:
    path: Packages/RepEngine
  Networking:
    path: Packages/Networking
  OnboardingFeature:
    path: Packages/OnboardingFeature
  ProfileFeature:
    path: Packages/ProfileFeature
  StatsFeature:
    path: Packages/StatsFeature
  SocialFeature:
    path: Packages/SocialFeature
  ClanFeature:
    path: Packages/ClanFeature

targets:
  Pushly:
    type: application
    platform: iOS
    sources:
      - path: Pushly
      - path: Shared/AlarmKit
      - path: ../shared/pose-models
        buildPhase: resources
        excludes: [SHA256SUMS]
    dependencies:
      - package: Core
      - package: AlarmDomain
      - package: AlarmFeature
      - package: WakeFlowFeature
      - package: DesignSystem
      - package: RepEngine
      - package: Networking
      - package: OnboardingFeature
      - package: ProfileFeature
      - package: StatsFeature
      - package: SocialFeature
      - package: ClanFeature
      - target: PushlyWidgets
        embed: true
    info:
      path: Pushly/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pushly
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "Pushly uses the camera to count your push-ups. Video is analysed on your device and never stored."
        NSMotionUsageDescription: "Pushly checks that the phone lies still while it counts, so only real push-ups count."
        NSAlarmKitUsageDescription: "Pushly uses alarms to wake you up for your push-up challenge, even in Silent mode or Focus."
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.pushly.alarm-refresh]
        CFBundleURLTypes:
          - CFBundleURLName: app.pushly.deeplink
            CFBundleURLSchemes: [pushly]
        SupabaseURL: "$(SUPABASE_URL)"
        SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
    entitlements:
      path: Pushly/Resources/Pushly.entitlements
      properties:
        com.apple.security.application-groups: [group.app.pushly]
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pushly
        PROVISIONING_PROFILE_SPECIFIER: "$(PUSHLY_PROFILE_APP)"   # set only by CI manual signing (D-042)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PushlyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PushlyWidgets
      - path: Shared/AlarmKit
    dependencies:
      - package: DesignSystem
    info:
      path: PushlyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pushly Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PushlyWidgets/PushlyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.pushly]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pushly.widgets
        PROVISIONING_PROFILE_SPECIFIER: "$(PUSHLY_PROFILE_WIDGETS)"
  PushlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PushlyTests
    dependencies:
      - target: Pushly

schemes:
  Pushly:
    build:
      targets:
        Pushly: all
    test:
      config: Debug
      targets:
        - PushlyTests
        - package: Core/CoreTests
        - package: AlarmDomain/AlarmDomainTests
        - package: AlarmFeature/AlarmFeatureTests
        - package: PoseEngine/PoseEngineTests
        - package: WakeFlowFeature/WakeFlowFeatureTests
        - package: DesignSystem/DesignSystemTests
        - package: RepEngine/RepEngineTests
        - package: Networking/NetworkingTests
        - package: OnboardingFeature/OnboardingFeatureTests
        - package: ProfileFeature/ProfileFeatureTests
        - package: StatsFeature/StatsFeatureTests
        - package: SocialFeature/SocialFeatureTests
        - package: ClanFeature/ClanFeatureTests
    run:
      config: Debug
    archive:
      config: Release
